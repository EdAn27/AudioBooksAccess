<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AudioBooks Access</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
  <div class="logo">
  <img src="assets/logo.png" alt="logo">
  <div class="logo-text">
    <span>AudioBooks</span>
    <span>Access</span>
  </div>
</div>

  <div class="modo">
    Modo accesible activo ✔
  </div>
</header>

<main class="main">

  <h1>AudioBooks Access</h1>
  <p class="subtitle">"Bienvenido, Di un libro o un curso"</p>

  <!-- HABLAR -->
  <div class="card-mic">

    <div class="mic-circle" onclick="escuchar()">
      <img src="https://img.icons8.com/sf-regular-filled/48/microphone.png" alt="microfono">
    </div>

    <div class="mic-text">
      <h2>Hablar</h2>
      <p>Presiona el micrófono y di tu comando</p>
    </div>

  </div>

  <!-- CATEGORÍAS -->
  <h3 class="titulo-categorias">Categorías:</h3>

  <div class="categorias">
    <div class="cat" onclick="buscarCategoria('comunicacion')">💬<span>Comunicación</span></div>
    <div class="cat" onclick="buscarCategoria('matematica')">123<span>Matemática</span></div>
    <div class="cat" onclick="buscarCategoria('ciencia')">🧪<span>Ciencia</span></div>
    <div class="cat" onclick="buscarCategoria('historia')">🏛<span>Historia</span></div>
    <div class="cat" onclick="buscarCategoria('ingles')">A<span>Inglés</span></div>
  </div>

<div class="config-container">
  <button class="btn-config" onclick="window.location.href='pages/config.html'">⚙️ Configuración</button>
</div>

</main>
<script src="js/voz.js"></script>
<script>
function buscarCategoria(cat) {
  localStorage.setItem("busquedaVoz", cat);
  window.location.href = "pages/buscar.html";
}
</script>
</body>
</html>
