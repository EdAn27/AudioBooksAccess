<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproducción</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reproducir.css">
</head>

<body>

<header class="header">

  <div class="logo">
    <img src="../assets/logo.png">
    <div class="logo-text">
      <span>AudioBooks</span>
      <span>Access</span>
    </div>
  </div>

  <div class="modo">
    🎙 Modo de voz activo
  </div>

</header>

<main class="main">

  <h2>Reproducción</h2>

  <div class="comando-box">
    Di: pausar, continuar o regresar
  </div>

  <div class="card-libro">
    <h3 id="tituloLibro"></h3>

    <div class="controles">
      <button onclick="reproducir()">▶ Reproducir</button>
      <button onclick="pausar()">⏸ Pausar</button>
    </div>
  </div>

  <div class="subtitulos" id="subtitulos">
    Cargando libro...
  </div>

  <div class="acciones">
    <span>🔊 Reproducción de Libro</span>
    <button class="btn-regresar" onclick="window.location.href='buscar.html'">Regresar</button>
  </div>

</main>

<script>
/* 1. APLICAR ESTILOS PERSONALIZADOS (ACCESIBILIDAD VISUAL) */
document.addEventListener("DOMContentLoaded", () => {
  const config = JSON.parse(localStorage.getItem("configAudioBooks")) || {};
  const subs = document.getElementById("subtitulos");
  
  if (config.tamano) subs.style.fontSize = config.tamano;
  if (config.color) subs.style.color = config.color;
});

/* 2. MANEJO DEL LIBRO ORIGINAL */
let libro = JSON.parse(localStorage.getItem("libroSeleccionado"));

if (!libro) {
  alert("No hay libro seleccionado");
}

document.getElementById("tituloLibro").innerText = libro.nombre;

/* VARIABLES DE CONTROL */
let partes = [];
let index = 0;
let hablando = false;

/* CARGAR EL TEXTO DESDE LA URL */
async function cargarTexto() {
  try {
    const response = await fetch(libro.url);
    if (!response.ok) throw new Error("No carga");

    const texto = await response.text();
    partes = texto.split(".").map(p => p.trim()).filter(p => p.length > 0);

    iniciarLectura();
  } catch (error) {
    console.error(error);
    document.getElementById("subtitulos").innerText = "❌ Error al cargar el texto";
  }
}

/* INICIO DE FLUJO */
function iniciarLectura() {
  hablando = true;
  index = 0;
  leer();
}

function reproducir() {
  hablando = true;
  leer();
}

function pausar() {
  hablando = false;
  window.speechSynthesis.cancel();
}

/* LEER TEXTO CON INTEGRACIÓN DE CONFIGURACIÓN DE AUDIO */
function leer() {
  if (!hablando || index >= partes.length) return;

  let frase = partes[index];

  document.getElementById("subtitulos").innerText = frase;

  let speech = new SpeechSynthesisUtterance(frase);
  
  // Extraer el idioma configurado (por defecto es-ES si no existe)
  const config = JSON.parse(localStorage.getItem("configAudioBooks")) || {};
  speech.lang = config.idioma || "es-ES";

  // Buscar coincidencia de voz nativa del sistema
  let voces = window.speechSynthesis.getVoices();
  let vocesIdioma = voces.filter(v => v.lang.startsWith(speech.lang.split('-')[0]));

  if (vocesIdioma.length > 0) {
    if (config.tipoVoz === 'masculina') {
      let vozHombre = vocesIdioma.find(v => v.name.toLowerCase().includes('pablo') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david'));
      if (vozHombre) speech.voice = vozHombre;
      else speech.pitch = 0.8; // Alternativa: Tono más grave si el sistema no tiene una voz masculina nativa
    } else {
      let vozMujer = vocesIdioma.find(v => v.name.toLowerCase().includes('laura') || v.name.toLowerCase().includes('helena') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('sabina'));
      if (vozMujer) speech.voice = vozMujer;
      else speech.pitch = 1.1; // Alternativa: Tono normal/agudo
    }
  }

  speech.onend = () => {
    index++;
    leer();
  };

  window.speechSynthesis.speak(speech); // 🔥 Mantiene el flujo sin cancel intermedio
}

/* VOZ CONTROL (RECONOCIMIENTO DE COMANDOS MULTIMEDIA ORIGINAL) */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const reconocimiento = new SpeechRecognition();

  reconocimiento.lang = "es-ES";
  reconocimiento.continuous = true;

  function iniciarMic() {
    try {
      reconocimiento.start();
    } catch {}
  }

  iniciarMic();

  reconocimiento.onresult = function(event) {
    let comando = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();

    console.log("🎤", comando);

    if (comando.includes("pausar") || comando.includes("pausa")) {
      pausar();
    }
    else if (comando.includes("continuar") || comando.includes("seguir") || comando.includes("reproducir")) {
      reproducir();
    }
    else if (comando.includes("regresar") || comando.includes("volver")) {
      pausar();
      window.location.href = "buscar.html";
    }
  };

  reconocimiento.onend = () => iniciarMic();
  reconocimiento.onerror = () => iniciarMic();
}

/* EVENTO ASÍNCRONO DE VOCES PARA EVITAR CONFLICTOS */
window.speechSynthesis.onvoiceschanged = () => {
  if (partes.length === 0) cargarTexto();
};

if (window.speechSynthesis.getVoices().length > 0) {
  cargarTexto();
}
</script>

</body>
</html>
