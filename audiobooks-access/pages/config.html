<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuración</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="../assets/logo.png">
    <div class="logo-text">
      <span>AudioBooks</span>
      <span>Access</span>
    </div>
  </div>
</header>

<main class="main">

  <h2>Configuración</h2>

  <div class="card-config">

    <label>Idioma</label>
    <select id="idioma">
      <option value="es-ES">Español</option>
      <option value="en-US">Inglés</option>
    </select>

    <label>Tamaño de texto</label>
    <select id="tamano">
      <option value="18px">Pequeño</option>
      <option value="22px">Mediano</option>
      <option value="28px">Grande</option>
    </select>

    <button onclick="guardarConfig()">Guardar</button>

  </div>

  <button onclick="window.location.href='../index.html'">
    ⬅ Regresar
  </button>

</main>

<script>

function guardarConfig() {

  const config = {
    idioma: document.getElementById("idioma").value,
    tamano: document.getElementById("tamano").value
  };

  localStorage.setItem("configAudioBooks", JSON.stringify(config));

  alert("Configuración guardada ✅");
}

function cargarConfig() {

  const config = JSON.parse(localStorage.getItem("configAudioBooks"));

  if (!config) return;

  document.getElementById("idioma").value = config.idioma;
  document.getElementById("tamano").value = config.tamano;
}

cargarConfig();

</script>

</body>
</html>
