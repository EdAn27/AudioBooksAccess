<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar libro</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/buscar.css">
</head>

<body>

<header class="header">

  <div class="logo">
    <img src="../assets/logo.png">
    <div class="logo-text">
      <span>AudioBooks</span>
      <span>Access</span>
    </div>
  </div>

  <div class="modo">
    🎙 Modo de voz activo
  </div>

</header>

<main class="main">

  <h2>Buscar libro</h2>

  <div class="escuchando-box">
    <div class="ondas">〰️〰️〰️</div>
    <div class="mic-circle">
      <img src="https://img.icons8.com/sf-regular-filled/48/microphone.png">
    </div>
    <div class="ondas">〰️〰️〰️</div>

    <h3>Procesando...</h3>
    <p>Comando detectado</p>
  </div>

  <div class="comando-box"></div>

  <ul class="resultados"></ul>

  <div class="acciones">
    <button onclick="window.location.href='../index.html'" class="btn-regresar">
      ⬅ Regresar
    </button>
  </div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/*  FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCwedwdUycIXM1M2_Oyyg8owbeA84VjvE8",
  authDomain: "audiobooks-access.firebaseapp.com",
  projectId: "audiobooks-access"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/*  VOZ */
function hablar(texto, callback) {

  window.speechSynthesis.cancel();

  let speech = new SpeechSynthesisUtterance(texto);
  speech.lang = "es-ES";

  speech.onend = () => callback && callback();

  window.speechSynthesis.speak(speech);
}

/*  RECONOCIMIENTO (UNO SOLO) */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let reconocimiento;
let listaActual = [];

if (SpeechRecognition) {

  reconocimiento = new SpeechRecognition();
  reconocimiento.lang = "es-ES";
  reconocimiento.continuous = true;

  function iniciarMic() {
    try { reconocimiento.start(); } catch {}
  }

  iniciarMic();

  reconocimiento.onresult = function(event) {

    let comando = event.results[event.results.length - 1][0].transcript.toLowerCase();

    console.log(comando);

    //  REGRESAR
    if (comando.includes("regresar") || comando.includes("volver")) {

      hablar("Regresando", () => {
        window.location.href = "../index.html";
      });

      return;
    }

    //  OPCIONES
    let numero = null;

    if (comando.includes("uno") || comando.includes("1")) numero = 0;
    else if (comando.includes("dos") || comando.includes("2")) numero = 1;
    else if (comando.includes("tres") || comando.includes("3")) numero = 2;
    else if (comando.includes("cuatro") || comando.includes("4")) numero = 3;

    if (numero !== null && listaActual[numero]) {

      let libro = listaActual[numero];

      hablar("Abriendo " + libro.nombre, () => {

        localStorage.setItem("libroSeleccionado", JSON.stringify(libro));
        window.location.assign("reproducir.html");

      });

    }
  };

  reconocimiento.onend = () => iniciarMic();
  reconocimiento.onerror = () => iniciarMic();
}

/* COMANDO */
let texto = localStorage.getItem("busquedaVoz") || "";

const comandoBox = document.querySelector(".comando-box");
const contenedor = document.querySelector(".resultados");

if (comandoBox) {
  comandoBox.innerHTML = " Comando detectado: " + texto;
}

/*  CARGAR LIBROS */
async function cargarLibros() {

  try {

    let lista = [];

    const querySnapshot = await getDocs(collection(db, "libros"));

    querySnapshot.forEach(doc => {

      const libro = doc.data();

      if (!libro.categoria || !libro.nombre) return;

      if (libro.categoria.toLowerCase().includes(texto)) {
        lista.push(libro);
      }
    });

    contenedor.innerHTML = "";

    lista.forEach((libro, i) => {
      let li = document.createElement("li");
      li.textContent = `Opción ${i + 1}: ${libro.nombre}`;
      contenedor.appendChild(li);
    });

    listaActual = lista;

    if (lista.length > 0) {

      let nombres = lista.map((l, i) => `opción ${i + 1}: ${l.nombre}`);

      hablar(
        "Los libros disponibles son: " + nombres.join(", "),
        () => {
          hablar("Di el número de la opción");
        }
      );

    } else {

      hablar("No hay libros disponibles en esta categoría");

    }

  } catch (error) {

    console.error(error);
    hablar("Error al cargar libros");

  }
}

/*  INICIAR */
cargarLibros();

</script>

</body>
</html>
